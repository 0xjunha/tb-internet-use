[project]
name = "tb-internet-use"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Junha Park", email = "0xjunha@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-bash==0.25.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
# A comparison that can never be true, e.g. a format type against a stale name string.
reportUnnecessaryComparison = "error"

[tool.ruff.format]
# Code in docs
exclude = ["*.md"]
